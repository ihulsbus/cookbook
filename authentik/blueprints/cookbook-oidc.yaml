version: 1
metadata:
  name: cookbook-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

# KIT-20: cookbook-web application + OIDC provider, a `cookbook-user`/
# `cookbook-admin` group pair matching the roles shared/oidc.RequireRole()
# checks after KIT-21/KIT-22 (see cookbook/TODO.md for the "administrator
# only" gap this replaces), and a custom scope mapping so access tokens
# carry a standard OIDC `groups` claim instead of Keycloak's
# `resource_access` shape.

entries:
  - model: authentik_core.group
    id: group-cookbook-admin
    identifiers:
      name: cookbook-admin
    attrs:
      name: cookbook-admin
      is_superuser: false

  - model: authentik_core.group
    id: group-cookbook-user
    identifiers:
      name: cookbook-user
    attrs:
      name: cookbook-user
      is_superuser: false

  - model: authentik_providers_oauth2.scopemapping
    id: scope-mapping-groups
    identifiers:
      name: "Cookbook: groups scope mapping"
    attrs:
      name: "Cookbook: groups scope mapping"
      scope_name: groups
      description: "Adds the user's Authentik group identifiers to the access/ID token as a `groups` claim - names for ordinary groups, UUIDs for households."
      # Two different consumers read this same claim and want two
      # different identifier shapes:
      #   - shared/oidc.RequireRole("cookbook-admin") and the frontend's
      #     hasGroup() check fixed, human-chosen role group names
      #     (KIT-20/21/22) - switching those to UUIDs would silently
      #     lock every admin-only endpoint, so ordinary groups keep
      #     emitting group.name, unchanged.
      #   - recipe-service's recipe_shares target_id for
      #     target_type=group (KIT-32/35), when the target is a
      #     self-service household (KIT-34 "decided": the household's
      #     Authentik group UUID is its target_id, consistent with the
      #     UUID that identity everywhere else - user-service's own
      #     household id, owner_id, sub).
      # Households are the only groups with a cookbook_household
      # attribute (set by user-service, see
      # cookbook/user-service/internal/services/UserService.go), so
      # that attribute is what picks the identifier shape per group.
      expression: |
        return {
            "groups": [
                str(group.pk) if group.attributes.get("cookbook_household") else group.name
                for group in request.user.ak_groups.all()
            ],
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-cookbook-web
    identifiers:
      name: cookbook-web
    attrs:
      name: cookbook-web
      client_type: public
      client_id: cookbook-web
      # KIT-33 "decided": sub must be the Authentik user's own UUID, so
      # it maps 1:1 to the core API's /api/v3/core/users/?uuid= filter -
      # user-service's only way to resolve a token's sub back to a
      # user. hashed_user_id (the old value) produces a UUID-shaped but
      # unrelated hash, which user-service could never resolve. Every
      # owner_id/target_id column in this codebase is already typed as
      # uuid on that assumption. NEVER change this again once real data
      # exists, or every existing owner_id/target_id is orphaned.
      sub_mode: user_uuid
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !KeyOf scope-mapping-groups
      redirect_uris:
        - matching_mode: strict
          url: "http://localhost:4200/oidc/callback"
        - matching_mode: strict
          url: "http://localhost:4200/oidc/silent-renew"
        - matching_mode: strict
          url: "http://localhost:4200/loggedout"
        - matching_mode: strict
          url: "https://gourmedy.com/oidc/callback"
        - matching_mode: strict
          url: "https://gourmedy.com/oidc/silent-renew"
        - matching_mode: strict
          url: "https://gourmedy.com/loggedout"

  - model: authentik_core.application
    id: application-cookbook-web
    identifiers:
      slug: cookbook-web
    attrs:
      name: Cookbook Web
      slug: cookbook-web
      provider: !KeyOf provider-cookbook-web
      open_in_new_tab: false
