version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: cookbook-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: postgres
      TZ: Europe/Amsterdam
    ports:
      - "5432:5432"
    volumes:
      # PG18's alpine image moved PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin adminpassword;
      /usr/bin/mc mb myminio/cbhbe --ignore-existing;
      exit 0;
      "
    networks:
      - cookbook-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: wENbwHUirBwZQbHpRB46egb9C
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cookbook-network

  recipe-service:
    image: ghcr.io/ihulsbus/cookbook/recipe-service:master
    container_name: recipe-service
    # Copy docker/config/recipe-service/config.yaml.example to config.yaml
    # (gitignored) and fill in oauth.clientsecret before first run.
    volumes:
      - ./docker/config/recipe-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.recipe-service.rule: "PathPrefix(`/api/v2/recipe`)"
      traefik.http.services.recipe-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  metadata-service:
    image: ghcr.io/ihulsbus/cookbook/metadata-service:master
    container_name: metadata-service
    volumes:
      - ./docker/config/metadata-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.metadata-service.rule: "PathPrefix(`/api/v2/metadata`)"
      traefik.http.services.metadata-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  ingredient-service:
    image: ghcr.io/ihulsbus/cookbook/ingredient-service:master
    container_name: ingredient-service
    volumes:
      - ./docker/config/ingredient-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.ingredient-service.rule: "PathPrefix(`/api/v2/ingredient`) || PathPrefix(`/api/v2/unit`) || PathPrefix(`/api/v2/amount`)"
      traefik.http.services.ingredient-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  instruction-service:
    image: ghcr.io/ihulsbus/cookbook/instruction-service:master
    container_name: instruction-service
    volumes:
      - ./docker/config/instruction-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.instruction-service.rule: "PathPrefix(`/api/v2/instruction`)"
      traefik.http.services.instruction-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  image-service:
    image: ghcr.io/ihulsbus/cookbook/image-service:master
    container_name: image-service
    volumes:
      - ./docker/config/image-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.image-service.rule: "PathPrefix(`/api/v2/images`)"
      traefik.http.services.image-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  search-service:
    image: ghcr.io/ihulsbus/cookbook/search-service:master
    container_name: search-service
    volumes:
      - ./docker/config/search-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.search-service.rule: "PathPrefix(`/api/v2/search`)"
      traefik.http.services.search-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    image: ghcr.io/ihulsbus/cookbook/user-service:master
    container_name: user-service
    volumes:
      - ./docker/config/user-service/config.yaml:/config/config.yaml:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.user-service.rule: "PathPrefix(`/api/v2/user`)"
      traefik.http.services.user-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cookbook-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
