version: '3.8'

services:
  # PostgreSQL - Single instance with multiple databases
  postgres:
    image: postgres:15-alpine
    container_name: cookbook-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pass
      POSTGRES_DB: postgres
      TZ: Europe/Amsterdam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket creation
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 admin adminpassword;
      /usr/bin/mc mb myminio/cbhbe --ignore-existing;
      /usr/bin/mc anonymous set download myminio/cbhbe;
      exit 0;
      "
    networks:
      - cookbook-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: wENbwHUirBwZQbHpRB46egb9C
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - cookbook-network

  # Keycloak
  keycloak:
    image: docker.io/bitnamilegacy/keycloak:24.0.4-debian-12-r1
    container_name: keycloak
    environment:
      BITNAMI_DEBUG: "false"
      KEYCLOAK_ADMIN: administrator
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KEYCLOAK_HTTP_PORT: "8080"
      KEYCLOAK_PROXY: "edge"
      KEYCLOAK_ENABLE_STATISTICS: "false"
      KEYCLOAK_DATABASE_HOST: postgres
      KEYCLOAK_DATABASE_PORT: "5432"
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: ${KEYCLOAK_POSTGRESQL_PASSWORD:-keycloak_pass}
      KEYCLOAK_PRODUCTION: "false"
      KEYCLOAK_ENABLE_HTTPS: "false"
      KEYCLOAK_HTTP_RELATIVE_PATH: "/"
      KEYCLOAK_LOG_OUTPUT: "default"
      KEYCLOAK_LOG_LEVEL: "INFO"
      KEYCLOAK_JDBC_PARAMS: ""
      KEYCLOAK_CACHE_TYPE: "local"
      KC_HEALTH_ENABLED: "false"
      KC_METRICS_ENABLED: "false"
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.entrypoints: "websecure"
      traefik.http.routers.keycloak.rule: "Host(`auth.gourmedy.com`) || Host(`auth-admin.gourmedy.com`)"
      traefik.http.routers.keycloak.tls: "true"
      traefik.http.routers.keycloak.tls.domains[0].main: "auth.gourmedy.com"
      traefik.http.routers.keycloak.tls.domains[1].main: "auth-admin.gourmedy.com"
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # Recipe Service
  recipe-service:
    image: ghcr.io/ihulsbus/cookbook/recipe-service:latest
    container_name: recipe-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: recipe
      DATABASE_USER: recipe
      DATABASE_PASSWORD: recipe_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: wENbwHUirBwZQbHpRB46egb9C
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.recipe-service.rule: "PathPrefix(`/api/v2/recipe`)"
      traefik.http.services.recipe-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Metadata Service
  metadata-service:
    image: ghcr.io/ihulsbus/cookbook/metadata-service:latest
    container_name: metadata-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: metadata
      DATABASE_USER: metadata
      DATABASE_PASSWORD: metadata_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.metadata-service.rule: "PathPrefix(`/api/v2/metadata`)"
      traefik.http.services.metadata-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ingredient Service
  ingredient-service:
    image: ghcr.io/ihulsbus/cookbook/ingredient-service:latest
    container_name: ingredient-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ingredient
      DATABASE_USER: ingredient
      DATABASE_PASSWORD: ingredient_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.ingredient-service.rule: "PathPrefix(`/api/v2/ingredient`) || PathPrefix(`/api/v2/unit`) || PathPrefix(`/api/v2/amount`)"
      traefik.http.services.ingredient-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Instruction Service
  instruction-service:
    image: ghcr.io/ihulsbus/cookbook/instruction-service:latest
    container_name: instruction-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: instruction
      DATABASE_USER: instruction
      DATABASE_PASSWORD: instruction_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      RECIPECLIENT_BASEURL: http://recipe-service:8080/api/v2
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.instruction-service.rule: "PathPrefix(`/api/v2/instruction`)"
      traefik.http.services.instruction-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      recipe-service:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Image Service
  image-service:
    image: ghcr.io/ihulsbus/cookbook/image-service:latest
    container_name: image-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: image
      DATABASE_USER: image
      DATABASE_PASSWORD: image_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: wENbwHUirBwZQbHpRB46egb9C
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      S3_REGION: us-east-1
      S3_AWSACCESSKEY: admin
      S3_AWSACCESSSECRET: adminpassword
      S3_BUCKETNAME: cbhbe
      S3_ENDPOINT: http://minio:9000
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.image-service.rule: "PathPrefix(`/api/v2/images`)"
      traefik.http.services.image-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Search Service
  search-service:
    image: ghcr.io/ihulsbus/cookbook/search-service:latest
    container_name: search-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: search
      DATABASE_USER: search
      DATABASE_PASSWORD: search_pass
      DATABASE_SSLMODE: disable
      DATABASE_TIMEZONE: Europe/Amsterdam
      OAUTH_CLIENTID: gourmedy
      OAUTH_CLIENTSECRET: ""
      OAUTH_AUDIENCE: gourmedyfr
      OAUTH_URL: http://keycloak:8080
      OAUTH_REALM: gourmedy
      GLOBAL_LOGLEVEL: INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.search-service.rule: "PathPrefix(`/api/v2/search`)"
      traefik.http.services.search-service.loadbalancer.server.port: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - cookbook-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service
  notification-service:
    image: ghcr.io/ihulsbus/cookbook/notification-service:latest
    container_name: notification-service
    environment:
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: wENbwHUirBwZQbHpRB46egb9C
      GLOBAL_LOGLEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cookbook-network

networks:
  cookbook-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
