      operationId: update-image
      x-stoplight:
        id: v4x9i5gl3jt3f
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  x-stoplight:
                    id: scryqm2skvxi7
                  format: binary
                  description: 'image file, either JPG or PNG'
            examples:
              Example 1:
                value:
                  image: <image file>
        description: Update an image file in the CDN. Image can either be JPEG or PNG.
      description: |-
        Update an image. Image can either be JPEG or PNG. The dimensions must be between 300x300 and 1000x1000.
        Max file size is 5MB
