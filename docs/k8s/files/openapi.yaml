        '200':
          description: Returned on a succesful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImageResponse'
              examples:
                Example 1:
                  value:
                    data:
                      - id: 6d279760-11be-4adb-af72-1873cb90dc27
                        entity_type: recipe
                        entity_id: 6c4e174f-e760-4a4d-af6e-d1d5849b0fe1
                        size: 93055
                        type: image/jpeg
                    pagination:
                      page: 1
                      limit: 25
                      total: 1
                      total_pages: 1
                      has_next: false
                      has_previous: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '404':
          description: Returned if there are no images to return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example 1:
                  value:
                    error: this is an error message
        '500':
          description: Returned if an unrecoverable internal error occured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example 1:
                  value:
                    error: this is an error message
      operationId: get-all-images
