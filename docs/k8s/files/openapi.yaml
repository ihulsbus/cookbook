openapi: 3.1.0
x-stoplight:
  id: isr7fh356zetw
info:
  title: Cookbook
  version: '2.0'
  summary: Backend API belonging to the gourmedy app
  contact:
    name: Ian Hulsbus
    url: 'https://github.com/ihulsbus/cookbook/issues'
    email: github@hulsbus.be
  termsOfService: 'https://github.com/ihulsbus/cookbook/blob/feature/V2-microservices/LICENSE'
  license:
    name: AGPL-3.0
    url: 'https://github.com/ihulsbus/cookbook/blob/feature/V2-microservices/LICENSE'
  description: Backend API belonging to the gourmedy app.
servers:
  - url: 'https://api-staging.gourmedy.com/api/v2'
    description: Staging
paths:
  /recipe:
    get:
      summary: Get all recipes
      tags:
        - recipe
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRecipeResponse'
              examples:
                Example 1:
                  value:
                    data:
                      - id: 6c4e174f-e760-4a4d-af6e-d1d5849b0fe1
                        name: Test
                        description: test
                        serving_count: 1
                    pagination:
                      page: 1
                      limit: 25
                      total: 1
                      total_pages: 1
                      has_next: false
                      has_previous: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '404':
          $ref: '#/components/responses/Not-Found'
        '500':
          $ref: '#/components/responses/Internal-server-error'
      operationId: get-all-recipes
      x-stoplight:
        id: x9bcpbqs4cmse
      description: Retrieves recipes from the API in a paginated format
      requestBody:
        description: No request body required
        content:
          text/plain:
            schema:
              type: string
    post:
      summary: Create recipe
      tags:
        - recipe
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                Example 1:
                  value:
                    id: 6c4e174f-e760-4a4d-af6e-d1d5849b0fe1
                    name: Test
                    description: test
                    serving_count: 1
        '400':
          $ref: '#/components/responses/Bad-request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '500':
          $ref: '#/components/responses/Internal-server-error'
      operationId: create-recipe
      x-stoplight:
        id: no4i864r4raqb
      description: Create a recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
            examples:
              Example 1:
                value:
                  name: Test
                  description: test
                  serving_count: 1
        description: Create a recipe. Omit the ID field in the body. It will be generated internally on creation
  '/recipe/{RecipeID}':
    parameters:
      - $ref: '#/components/parameters/RecipeID'
    get:
      summary: Get single recipe
      tags:
        - recipe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                Example 1:
                  value:
                    id: 6c4e174f-e760-4a4d-af6e-d1d5849b0fe1
                    name: Test
                    description: test
                    serving_count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '404':
          $ref: '#/components/responses/Not-Found'
        '500':
          $ref: '#/components/responses/Internal-server-error'
      operationId: get-recipe
      x-stoplight:
        id: yki87keu89sns
      description: Get a single recipe based on the provided recipeID
      parameters: []
      requestBody:
        description: No request body required
        content:
          text/plain:
            schema:
              type: string
    put:
      summary: Update recipe
      tags:
        - recipe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
              examples:
                Example 1:
                  value:
                    id: 6c4e174f-e760-4a4d-af6e-d1d5849b0fe1
                    name: Test
                    description: test
                    serving_count: 1
        '400':
          $ref: '#/components/responses/Bad-request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '500':
          $ref: '#/components/responses/Internal-server-error'
      operationId: update-recipe
      x-stoplight:
        id: ynrp85bvdyxac
      description: Update a recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recipe'
            examples:
              Example 1:
                value:
                  name: Test
                  description: test
                  serving_count: 1
        description: "Update a recipe. Omit the ID field in the body. It will be set based on the path parameter. \r\nID's in the body will be overwritten"
    delete:
      summary: Delete recipe
      tags:
        - recipe
      responses:
        '204':
          description: No Content is returned on a succesful delete
        '400':
          $ref: '#/components/responses/Bad-request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Insufficient-permissions'
        '500':
          $ref: '#/components/responses/Internal-server-error'
      operationId: delete-recipe
      x-stoplight:
        id: 448hl592drnse
      description: Delete a recipe
      requestBody:
        description: No request body required
        content:
          text/plain:
            schema:
              type: string
  /images:
    get:
