# Default values for image-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
pdb:
  minAvailable: 1

image:
  repository: swaggerapi/swagger-ui
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  privileged: false
  readOnlyRootFilesystem: false
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ports:
- name: http
  servicePort: 80
  containerPort: 8080
  protocol: TCP

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cbhbe.ams3.cdn.digitaloceanspaces.com"
  hosts:
    - host: api-staging.gourmedy.com
      paths:
        - path: /swagger
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 20Mi
  requests:
    cpu: 10m
    memory: 128Mi
    ephemeral-storage: 20Mi

autoscaling:
  enabled: false

# Additional volumes on the output Deployment definition.
volumes:
- name: config-volume
  configMap:
    name: docs

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
- name: config-volume
  mountPath: /config
environment:
- name: SWAGGER_JSON
  value: /config/openapi.yaml
- name: BASE_URL
  value: /swagger

nodeSelector: {}

tolerations: []

affinity: {}
