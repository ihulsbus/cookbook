# Default values for image-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
pdb:
  minAvailable: 1

image:
  repository: ghcr.io/ihulsbus/cookbook/recipe-service
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ports:
- name: http
  servicePort: 80
  containerPort: 8080
  protocol: TCP
# Internal-only API (KIT-28): GET /internal/v1/recipe/:id/access, for
# other services' shared/authz instances to call on a projection miss.
# Exposed on the ClusterIP Service for in-cluster callers, but NEVER add
# it to ingress.hosts[].paths below - the shared Helm library's ingress
# template only ever forwards to service.port (80), so this is already
# unreachable from outside the cluster through the Ingress regardless of
# path. Defense in depth (a NetworkPolicy restricting which pods may
# reach this port) isn't added here: the shared-library chart this
# service uses has no NetworkPolicy template today.
- name: internal
  servicePort: 9090
  containerPort: 9090
  protocol: TCP

# Health check probes
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: api-staging.gourmedy.com
      paths:
        - path: /api/v2/recipe
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 20Mi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 20Mi

autoscaling:
  enabled: false

# One-shot Job that runs recipe-service with --republish-access (KIT-31) to
# rebuild a consumer's recipe_access projection. Off by default - it must
# never run as part of a normal deploy. Enable per-invocation, e.g.:
#   helm install recipe-service-republish-access . \
#     --set republishAccessJob.enabled=true \
#     --set republishAccessJob.runID=$(date +%s)
# See README.md's "Runbook: rebuilding a recipe-access projection (KIT-31)".
republishAccessJob:
  enabled: false
  # Unique suffix for the Job name, so a later re-run (e.g. after a failed
  # attempt) doesn't collide with an existing (immutable) Job object.
  runID: ""
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600

# Additional volumes on the output Deployment definition.
volumes:
- name: tmpfs
  emptyDir:
    sizeLimit: 25Mi
- name: config-volume
  configMap:
    name: recipe-service

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
- name: config-volume
  mountPath: /config
- name: tmpfs
  mountPath: /tmp

environment:
- name: DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: recipe-service-recipe-database
      key: password
- name: RABBITMQ_PASSWORD
  valueFrom:
    secretKeyRef:
      name: image-service-rabbitmq-admin
      key: password
- name: OAUTH_CLIENTSECRET
  valueFrom:
    secretKeyRef:
      name: image-service-gourmedy-oauth
      key: password

nodeSelector: {}

tolerations: []

affinity: {}

keyvault:
  name: Gourmedy
  secrets:
  - gourmedy-oauth
  - recipe-database
  - rabbitmq-admin

config:
  mountPath: /config
  templates:
    config.yaml: |
      global:
        logLevel: TRACE
        ListenPort: 8080
        InternalListenPort: 9090

      cors:
        allowCredentials: false
        allowedOrigins:
        - http://localhost:4200
        allowedHeaders:
        - Authorization
        - "Content-Type"
        allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - HEAD

      oauth:
        issuer: https://auth.gourmedy.com/application/o/cookbook-web/
        audience: cookbook-web
        clientid: cookbook-service
        clientsecret: ""

      database:
        host: private-pgsql-ams3-cls0-do-user-1590686-0.c.db.ondigitalocean.com
        username: recipe
        password: ""
        port: 25060
        database: recipe
        sslMode: require
        timezone: Europe/Amsterdam

      rabbitmq:
        host: rabbitmq.gourmedy-production.svc.cluster.local:5672
        username: admin
        password: ""

