sonar.projectKey=ihulsbus_cookbook
sonar.organization=ihulsbus

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=cookbook
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# sonar.go.golangci-lint.reportPaths=lint-report.xml
# Each service's own workflow runs `go test` from that service's own
# directory (see e.g. .github/workflows/ingredient-service.yaml's "Go
# tests" step), writing test-report.out/coverage.out there - not into a
# shared test-reports//coverage-reports/ directory at the repo root,
# which never exists. Glob for the actual per-module location instead.
sonar.go.tests.reportPaths=*/test-report.out
sonar.go.coverage.reportPaths=*/coverage.out
sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions= docs/**,**/cmd/**,**/internal/config/**,**/internal/middleware/**,**/internal/utils/**,main.go,**/shared/models/**
